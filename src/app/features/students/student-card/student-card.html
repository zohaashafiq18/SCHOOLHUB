<div class="student-row">
  <span>{{ student.name }}</span>
  <span>{{ student.className }}</span>
  <span>{{ student.rollNumber }}</span>
  <span [class.active-status]="student.status === 'Active'"
        [class.inactive-status]="student.status !== 'Active'">
    {{ student.status }}
  </span>
  <span class="actions">
    <button class="edit-btn" (click)="edit.emit(student)">Edit</button>
    <button class="delete-btn" (click)="delete.emit(student)">Delete</button>
  </span>
</div>
